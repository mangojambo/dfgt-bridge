[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dfgt-bridge"
version = "1.0.0"
description = "Incremental, offline-testable HID PID force feedback bridge for DFGT"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-2.0-only"}
dependencies = []

[project.scripts]
dfgt-bridge = "dfgt_bridge.runner:main"
dfgt-bridge-gui = "dfgt_bridge.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dfgt_bridge = ["assets/*.svg", "assets/README.md"]
