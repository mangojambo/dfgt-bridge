<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans" viewBox="0 0 500 500" width="500" height="500">
  <title>Original schematic front view of the virtual G29</title>
  <desc>Original DFGT Bridge artwork. SPDX-License-Identifier: CC0-1.0. Sem fotografias ou logotipos de terceiros.</desc>
  <rect x="0" y="0" width="500" height="500" fill="#0f172a" />
  <text x="250" y="28" fill="#e2e8f0" font-size="18" text-anchor="middle">G29 VIRTUAL</text>
